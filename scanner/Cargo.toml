[package]
name = "drive-cartographer-scanner"
version = "0.1.0"
edition = "2024"

[lib]
name = "drive_cartographer_scanner"
path = "src/lib.rs"

[[bin]]
name = "drive-cartographer-scan"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
csv = "1.4.0"
rusqlite = { version = "0.37.0", default-features = false, features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["formatting"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
